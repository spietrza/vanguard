name: CI
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
# Least privilege: this workflow runs agent-authored PR code, so its token only reads.
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The same gate the factory runs before it opens a PR (typecheck, lint, test:coverage), so they cannot drift.
      - run: pnpm verify
      # apps/desktop is its own pnpm project (own lockfile + workspace), so it installs separately.
      - run: pnpm --dir apps/desktop install --frozen-lockfile
      - run: pnpm test:desktop
      # tsc + vite build: catches type breaks the vitest run alone misses (e.g. matcher types after a vitest major).
      - run: pnpm --dir apps/desktop build
      # SBOM over the installed dependency tree (node_modules present after install), SPDX JSON,
      # uploaded as a build artifact for provenance/audit.
      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: spdx-json
          artifact-name: vanguard-sbom.spdx.json

  # SCA gate: block a PR that introduces a dependency with a known high+ CVE (or a disallowed
  # license). Uses the GitHub dependency graph enabled alongside Dependabot alerts.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: high
